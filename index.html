<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Playfra - Ukraine Control Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body { margin:0; height:100%; }
body { font-family: system-ui, -apple-system, sans-serif; }
#map { height:100%; }

/* TIMELINE */
#timeline-container {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.95);
    padding:10px 16px;
    border-radius:12px;
    z-index:1200;
}
#timeline-controls {
    display:flex;
    align-items:center;
    gap:14px;
}
#timeline-controls button {
    border:none;
    background:#2c2c2c;
    color:white;
    width:32px;
    height:32px;
    border-radius:8px;
    cursor:pointer;
}
#timeline-controls button:disabled {
    opacity:0.4;
}
#timeline-date {
    font-weight:600;
    min-width:120px;
    text-align:center;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TIMELINE -->
<div id="timeline-container">
    <div id="timeline-controls">
        <button id="prev-date">‹</button>
        <div id="timeline-date">Loading...</div>
        <button id="next-date">›</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ===== MAP ===== */
const map = L.map('map', { preferCanvas: true })
    .setView([48.6857, 35.828], 6);

L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}')
.addTo(map);

/* ===== DATES CONFIG ===== */
const dates = [
    {
        label: "11.04.2026",
        russia: "https://playframap.github.io/data/russia1104.geojson",
        grayzone: "https://playframap.github.io/data/grayzone1104.geojson"
    },
    {
        label: "12.04.2026",
        russia: "https://playframap.github.io/data/russia1204.geojson",
        grayzone: "https://playframap.github.io/data/grayzone1204.geojson"
    }
];

let currentIndex = 0;
let currentLayers = {};

/* ===== LOAD STATIC (FORTIFICATIONS) ===== */
function loadStatic(url, style) {
    fetch(url)
    .then(r => r.json())
    .then(d => {
        L.geoJSON(d, { style }).addTo(map);
    })
    .catch(()=>{});
}

/* load once */
loadStatic("https://playframap.github.io/data/ditches.geojson", {
    color: "#ffc300", weight: 1.5
});
loadStatic("https://playframap.github.io/data/teeth.geojson", {
    color: "#00ffff", weight: 1.5
});
loadStatic("https://playframap.github.io/data/wire.geojson", {
    color: "#bcbcbc", weight: 1.5
});

/* ===== LOAD MAP (DYNAMIC WITH FADE) ===== */
function loadMap(index) {
    const config = dates[index];

    const oldLayers = Object.values(currentLayers);
    currentLayers = {};

    function load(url, name, style) {
        fetch(url)
        .then(r => r.json())
        .then(d => {
            const layer = L.geoJSON(d, {
                style: { ...style, opacity: 0, fillOpacity: 0 }
            }).addTo(map);

            currentLayers[name] = layer;

            // fade in
            setTimeout(() => {
                layer.setStyle(style);
            }, 50);
        })
        .catch(()=>{});
    }

    /* GRAYZONE (fixed colors) */
    load(config.grayzone, "Grayzone", {
        color: "#b4b4b4",
        weight: 1.6,
        fillColor: "#c3c3c3",
        fillOpacity: 0.3
    });

    load(config.russia, "Russia", {
        color: "#ff0000",
        weight: 1.6,
        fillColor: "#ca0000",
        fillOpacity: 0.3
    });

    /* fade out old layers */
    oldLayers.forEach(layer => {
        if (layer.setStyle) {
            layer.setStyle({
                opacity: 0,
                fillOpacity: 0
            });

            setTimeout(() => {
                map.removeLayer(layer);
            }, 250);
        } else {
            map.removeLayer(layer);
        }
    });
}

/* ===== TIMELINE ===== */
const timelineDate = document.getElementById('timeline-date');
const prevBtn = document.getElementById('prev-date');
const nextBtn = document.getElementById('next-date');

function updateTimeline() {
    timelineDate.innerText = dates[currentIndex].label;
    loadMap(currentIndex);

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === dates.length - 1;
}

prevBtn.onclick = () => {
    if (currentIndex > 0) {
        currentIndex--;
        updateTimeline();
    }
};

nextBtn.onclick = () => {
    if (currentIndex < dates.length - 1) {
        currentIndex++;
        updateTimeline();
    }
};

/* keyboard arrows */
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") prevBtn.click();
    if (e.key === "ArrowRight") nextBtn.click();
});

/* initial load */
updateTimeline();
</script>

</body>
</html>
