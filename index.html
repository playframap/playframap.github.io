<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Playfra - Ukraine Control Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body { margin:0; height:100%; }
body { font-family: system-ui, sans-serif; }
#map { height:100%; }

.rail-btn {
    position:absolute;
    left:12px;
    width:40px;
    height:40px;
    border-radius:10px;
    background:#2c2c2c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:1200;
}

#left-settings-btn { bottom:28px; }

#topright-controls, #info-overlay {
    position:absolute;
    left:64px;
    width:300px;
    background:#fff;
    border-radius:14px;
    padding:14px;
    box-shadow:0 12px 32px rgba(0,0,0,.35);
    z-index:1100;
    display:none;
}
#topright-controls { top:10px; }
#info-overlay { bottom:28px; max-height:70%; overflow:auto; }

.control-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
}
.control-row.sub { padding-left:14px; }

.control-row input[type="checkbox"] {
    appearance:none;
    width:44px;
    height:24px;
    background:#ccc;
    border-radius:12px;
    position:relative;
}
.control-row input[type="checkbox"]::before {
    content:"";
    position:absolute;
    top:3px;
    left:3px;
    width:18px;
    height:18px;
    background:#fff;
    border-radius:50%;
    transition:0.2s;
}
.control-row input[type="checkbox"]:checked {
    background:#2f3146;
}
.control-row input[type="checkbox"]:checked::before {
    transform:translateX(20px);
}

select#basemap-select {
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:none;
    outline:none;
    background:#2f3146;
    color:#fff;
    font-weight:500;
    cursor:pointer;
    appearance:none;
}

#timeline-container {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.95);
    padding:10px 16px;
    border-radius:12px;
    z-index:1200;
}
#timeline-controls {
    display:flex;
    gap:10px;
    align-items:center;
}
#timeline-controls button {
    background:#2c2c2c;
    color:#fff;
    border:none;
    width:32px;
    height:32px;
    border-radius:8px;
    cursor:pointer;
}
#timeline-date {
    min-width:90px;
    text-align:center;
    font-weight:600;
}
</style>
</head>

<body>

<div id="left-settings-btn" class="rail-btn">⚙</div>

<div id="map"></div>

<div id="timeline-container">
    <div id="timeline-controls">
        <button id="prev-date">‹</button>
        <div id="timeline-date">--</div>
        <button id="next-date">›</button>
    </div>
</div>

<!-- SETTINGS -->
<div id="topright-controls">

<strong>Imagery</strong>
<label class="control-row">
<select id="basemap-select">
<option value="google_sat">Google Satellite</option>
<option value="google_hybrid">Google Hybrid</option>
<option value="osm">OSM</option>
<option value="esri">ESRI</option>
</select>
</label>

<strong>Control</strong>
<label class="control-row">Show control <input type="checkbox" id="toggle-control" checked></label>
<label class="control-row sub">Gray zone <input type="checkbox" id="toggle-grayzone" checked></label>
<label class="control-row sub">Russia <input type="checkbox" id="toggle-russia" checked></label>

<strong>Fortifications</strong>
<label class="control-row">Show fortifications <input type="checkbox" id="toggle-fort"></label>
<label class="control-row sub">Ditches <input type="checkbox" id="toggle-ditches" checked></label>
<label class="control-row sub">Barbed wire <input type="checkbox" id="toggle-wire" checked></label>
<label class="control-row sub">Dragon's teeth <input type="checkbox" id="toggle-teeth" checked></label>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([48.6,35.8],6);

/* BASE LAYERS */
const baseLayers = {
osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'),
google_sat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'),
google_hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}')
};

let currentBase = baseLayers.google_sat;
currentBase.addTo(map);

/* DATES */
const dates = [
{label:"11.04.2026",russia:"https://playframap.github.io/data/russia1104.geojson",grayzone:"https://playframap.github.io/data/grayzone1104.geojson"},
{label:"12.04.2026",russia:"https://playframap.github.io/data/russia1204.geojson",grayzone:"https://playframap.github.io/data/grayzone1204.geojson"}
];

let currentIndex = 0;

/* STATE */
const state = {
russia: true,
grayzone: true,
showControl: true,
fort: {
    enabled: false,
    ditches: true,
    wire: true,
    teeth: true
}
};

/* LAYERS */
let layers = {
russia:null,
grayzone:null,
ditches:null,
wire:null,
teeth:null
};

function apply(){

if(layers.russia){
state.russia ? layers.russia.addTo(map) : map.removeLayer(layers.russia);
}
if(layers.grayzone){
state.grayzone ? layers.grayzone.addTo(map) : map.removeLayer(layers.grayzone);
}

if(layers.ditches){
(state.fort.enabled && state.fort.ditches)
? layers.ditches.addTo(map)
: map.removeLayer(layers.ditches);
}

if(layers.wire){
(state.fort.enabled && state.fort.wire)
? layers.wire.addTo(map)
: map.removeLayer(layers.wire);
}

if(layers.teeth){
(state.fort.enabled && state.fort.teeth)
? layers.teeth.addTo(map)
: map.removeLayer(layers.teeth);
}
}

async function loadMap(i){

currentIndex = i;
document.getElementById("timeline-date").innerText = dates[i].label;

Object.values(layers).forEach(l=>{
if(l) map.removeLayer(l);
});

layers = {
russia:null,
grayzone:null,
ditches:null,
wire:null,
teeth:null
};

const [rus, gray, ditches, wire, teeth] = await Promise.all([
fetch(dates[i].russia).then(r=>r.json()),
fetch(dates[i].grayzone).then(r=>r.json()),
fetch("https://playframap.github.io/data/ditches.geojson").then(r=>r.json()),
fetch("https://playframap.github.io/data/wire.geojson").then(r=>r.json()),
fetch("https://playframap.github.io/data/teeth.geojson").then(r=>r.json())
]);

layers.russia = L.geoJSON(rus,{style:{color:"#ff0000",weight:1.6,fillOpacity:0.3}});
layers.grayzone = L.geoJSON(gray,{style:{color:"#b4b4b4",weight:1.6,fillOpacity:0.3}});

layers.ditches = L.geoJSON(ditches,{style:{color:"#ffc300",weight:1.2}});
layers.wire = L.geoJSON(wire,{style:{color:"#c3c3c3",weight:1}});
layers.teeth = L.geoJSON(teeth,{style:{color:"#00fff8",weight:1.4}});

apply();
}

/* CONTROL TOGGLE */
document.getElementById("toggle-control").onchange=e=>{
state.russia = e.target.checked;
state.grayzone = e.target.checked;
document.getElementById("toggle-russia").checked = e.target.checked;
document.getElementById("toggle-grayzone").checked = e.target.checked;
apply();
};

document.getElementById("toggle-russia").onchange=e=>{
state.russia = e.target.checked;
apply();
};

document.getElementById("toggle-grayzone").onchange=e=>{
state.grayzone = e.target.checked;
apply();
};

/* FORT MASTER TOGGLE (FIXED STATE RESTORE) */
let savedFortState = {
    ditches: true,
    wire: true,
    teeth: true
};

document.getElementById("toggle-fort").onchange=e=>{
state.fort.enabled = e.target.checked;

if(!e.target.checked){

savedFortState = {
    ditches: state.fort.ditches,
    wire: state.fort.wire,
    teeth: state.fort.teeth
};

state.fort.ditches = false;
state.fort.wire = false;
state.fort.teeth = false;

document.getElementById("toggle-ditches").checked = false;
document.getElementById("toggle-wire").checked = false;
document.getElementById("toggle-teeth").checked = false;

} else {

state.fort.ditches = savedFortState.ditches;
state.fort.wire = savedFortState.wire;
state.fort.teeth = savedFortState.teeth;

document.getElementById("toggle-ditches").checked = savedFortState.ditches;
document.getElementById("toggle-wire").checked = savedFortState.wire;
document.getElementById("toggle-teeth").checked = savedFortState.teeth;
}

apply();
};

/* INDIVIDUAL FORT TOGGLES */
document.getElementById("toggle-ditches").onchange=e=>{
state.fort.ditches = e.target.checked;
apply();
};

document.getElementById("toggle-wire").onchange=e=>{
state.fort.wire = e.target.checked;
apply();
};

document.getElementById("toggle-teeth").onchange=e=>{
state.fort.teeth = e.target.checked;
apply();
};

/* BASEMAP */
document.getElementById("basemap-select").onchange=e=>{
map.removeLayer(currentBase);
currentBase = baseLayers[e.target.value];
currentBase.addTo(map);
};

/* NAV */
document.getElementById("prev-date").onclick=()=>{
if(currentIndex>0) loadMap(currentIndex-1);
};

document.getElementById("next-date").onclick=()=>{
if(currentIndex<dates.length-1) loadMap(currentIndex+1);
};

document.getElementById("left-settings-btn").onclick=()=>{
const el=document.getElementById("topright-controls");
el.style.display = el.style.display==="block"?"none":"block";
};

loadMap(0);
</script>

</body>
</html>
