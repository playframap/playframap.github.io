<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Playfra - Ukraine Control Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body { margin:0; height:100%; }
body { font-family: system-ui, sans-serif; }
#map { height:100%; }

.rail-btn {
    position:absolute;
    left:12px;
    width:40px;
    height:40px;
    border-radius:10px;
    background:#2c2c2c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:1200;
}

#left-settings-btn { bottom:28px; }
#timeline-notes-btn {
    bottom: 78px;
}
    
#topright-controls {
    position:absolute;
    left:64px;
    top:10px;
    width:300px;
    background:#fff;
    border-radius:14px;
    padding:14px;
    box-shadow:0 12px 32px rgba(0,0,0,.35);
    z-index:1100;
    display:none;
}

.control-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
}

.control-row.sub { padding-left:14px; }

.control-row input[type="checkbox"] {
    appearance:none;
    width:44px;
    height:24px;
    background:#ccc;
    border-radius:12px;
    position:relative;
}

.control-row input[type="checkbox"]::before {
    content:"";
    position:absolute;
    top:3px;
    left:3px;
    width:18px;
    height:18px;
    background:#fff;
    border-radius:50%;
    transition:0.2s;
}

.control-row input[type="checkbox"]:checked {
    background:#2f3146;
}

.control-row input[type="checkbox"]:checked::before {
    transform:translateX(20px);
}

    #notes-popup {
    position: absolute;
    left: 12px;
    top: 10px;
    transform: translateX(52px);    
    width: 320px;
    max-height: 400px;
    overflow-y: auto;
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
    z-index: 1300;
    display: none;
}

.note-item {
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
}

.note-date {
    font-weight: 700;
    margin-bottom: 4px;
}

select#basemap-select {
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:none;
    outline:none;
    background:#2f3146;
    color:#fff;
    font-weight:500;
    cursor:pointer;
}

#timeline-container {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.95);
    padding:10px 16px;
    border-radius:12px;
    z-index:1200;
}

#timeline-controls {
    display:flex;
    gap:10px;
    align-items:center;
}

#timeline-controls button {
    background:#2c2c2c;
    color:#fff;
    border:none;
    width:32px;
    height:32px;
    border-radius:8px;
    cursor:pointer;
}

#timeline-date {
    min-width:90px;
    text-align:center;
    font-weight:600;
}
</style>
</head>

<body>
    
<div id="timeline-notes-btn" class="rail-btn">📝</div>
<div id="left-settings-btn" class="rail-btn">⚙</div>
<div id="map"></div>

<div id="timeline-container">
    <div id="timeline-controls">
        <button id="prev-date">‹</button>
        <div id="timeline-date" style="cursor:pointer;">--</div>
<input type="date" id="date-picker" style="display:none;">
        <button id="next-date">›</button>
    </div>
</div>

    <div id="notes-popup">
    <div id="notes-content"></div>
</div>
<div id="topright-controls">

<strong>Imagery</strong>
<label class="control-row">
<select id="basemap-select">
<option value="google_sat">Google Satellite</option>
<option value="google_hybrid">Google Hybrid</option>
<option value="osm">OSM</option>
<option value="esri">ESRI</option>
</select>
</label>

<strong>Control</strong>
<label class="control-row">Show control <input type="checkbox" id="toggle-control" checked></label>
<label class="control-row sub">Gray zone <input type="checkbox" id="toggle-grayzone" checked></label>
<label class="control-row sub">Russia <input type="checkbox" id="toggle-russia" checked></label>

<strong>Fortifications</strong>
<label class="control-row">Show fortifications <input type="checkbox" id="toggle-fort"></label>
<label class="control-row sub">Ditches <input type="checkbox" id="toggle-ditches"></label>
<label class="control-row sub">Barbed wire <input type="checkbox" id="toggle-wire"></label>
<label class="control-row sub">Dragon's teeth <input type="checkbox" id="toggle-teeth"></label>

</div>

const dateIndexMap = new Map(
    dates.map((d, i) => {
        const [day, month, year] = d.label.split(".");
        return [`${year}-${month}-${day}`, i]; // format for input[type=date]
    })
);

document.getElementById("timeline-date").onclick = () => {
    const picker = document.getElementById("date-picker");

    // set current date in picker
    const current = dates[currentIndex].label.split(".");
    picker.value = `${current[2]}-${current[1]}-${current[0]}`;

    picker.showPicker(); // opens calendar (modern browsers)
};

document.getElementById("date-picker").onchange = (e) => {
    const selected = e.target.value;

    if(dateIndexMap.has(selected)){
        loadMap(dateIndexMap.get(selected));
    }
};
    
let currentIndex = 0;

/* STATE */
const state = {
    russia: true,
    grayzone: true,
    fort: {
        enabled: false,
        ditches: true,
        wire: true,
        teeth: true
    }
};

/* CACHE */
const cache = {
    russia: new Map(),
    grayzone: new Map(),
    ditches: null,
    wire: null,
    teeth: null,
    staticLoaded: false
};

/* LAYERS (created ONCE) */
function makeLayer(style){
    return L.geoJSON(null, { style });
}

const layers = {
    russia: makeLayer({color:"#ff0000",weight:1.4,fillOpacity:0.3}),
    grayzone: makeLayer({color:"#b4b4b4",weight:1.4,fillOpacity:0.3}),
    ditches: makeLayer({color:"#ffc300",weight:1.2}),
    wire: makeLayer({color:"#c3c3c3",weight:1}),
    teeth: makeLayer({color:"#00fff8",weight:1.4})
};

Object.values(layers).forEach(l => l.addTo(map));

/* FORT STATE SAFE STORAGE */
let savedFort = {
    ditches: true,
    wire: true,
    teeth: true
};

/* LAYER TOGGLE */
function setLayer(layer, condition){
    if(condition){
        if(!map.hasLayer(layer)) map.addLayer(layer);
    } else {
        if(map.hasLayer(layer)) map.removeLayer(layer);
    }
}

/* APPLY */
function apply(){
    setLayer(layers.russia, state.russia);
    setLayer(layers.grayzone, state.grayzone);
    
    if (map.hasLayer(layers.russia)) layers.russia.bringToFront();
    
    const fortReady = cache.staticLoaded;
    const f = fortReady;

    setLayer(layers.ditches, f && state.fort.enabled && state.fort.ditches);
    setLayer(layers.wire, f && state.fort.enabled && state.fort.wire);
    setLayer(layers.teeth, f && state.fort.enabled && state.fort.teeth);
}

/* LOAD MAP */
async function loadMap(i){
    currentIndex = i;
    const d = dates[i];

    document.getElementById("timeline-date").innerText = d.label;

    const [russia, grayzone] = await Promise.all([
        cache.russia.get(i) ?? cache.russia.set(i, fetch(d.russia).then(r=>r.json())).get(i),
        cache.grayzone.get(i) ?? cache.grayzone.set(i, fetch(d.grayzone).then(r=>r.json())).get(i)
    ]);

    layers.russia.clearLayers();
    layers.grayzone.clearLayers();

    layers.russia.addData(russia);
    layers.grayzone.addData(grayzone);

    /* STATIC FORTIFICATIONS */
    if(!cache.staticLoaded){
        const [d1,w,t] = await Promise.all([
            fetch("https://playframap.github.io/data/ditches.geojson").then(r=>r.json()),
            fetch("https://playframap.github.io/data/wire.geojson").then(r=>r.json()),
            fetch("https://playframap.github.io/data/teeth.geojson").then(r=>r.json())
        ]);

        cache.ditches = d1;
        cache.wire = w;
        cache.teeth = t;

        layers.ditches.addData(d1);
        layers.wire.addData(w);
        layers.teeth.addData(t);

        cache.staticLoaded = true;
    }

    apply();
}

/* CONTROLS */
document.getElementById("toggle-control").onchange = e => {
    state.russia = e.target.checked;
    state.grayzone = e.target.checked;

    document.getElementById("toggle-russia").checked = e.target.checked;
    document.getElementById("toggle-grayzone").checked = e.target.checked;

    apply();
};

document.getElementById("toggle-russia").onchange = e => {
    state.russia = e.target.checked;
    apply();
};

document.getElementById("toggle-grayzone").onchange = e => {
    state.grayzone = e.target.checked;
    apply();
};

/* FORT TOGGLE */
document.getElementById("toggle-fort").onchange = e => {
    state.fort.enabled = e.target.checked;

    if(!state.fort.enabled){
        savedFort = {
            ditches: state.fort.ditches,
            wire: state.fort.wire,
            teeth: state.fort.teeth
        };

        state.fort.ditches = false;
        state.fort.wire = false;
        state.fort.teeth = false;

        document.getElementById("toggle-ditches").checked = false;
        document.getElementById("toggle-wire").checked = false;
        document.getElementById("toggle-teeth").checked = false;
    } else {
        state.fort.ditches = savedFort.ditches;
        state.fort.wire = savedFort.wire;
        state.fort.teeth = savedFort.teeth;

        document.getElementById("toggle-ditches").checked = savedFort.ditches;
        document.getElementById("toggle-wire").checked = savedFort.wire;
        document.getElementById("toggle-teeth").checked = savedFort.teeth;
    }

    apply();
};

/* INDIVIDUAL FORT */
document.getElementById("toggle-ditches").onchange = e => {
    state.fort.ditches = e.target.checked;
    apply();
};

document.getElementById("toggle-wire").onchange = e => {
    state.fort.wire = e.target.checked;
    apply();
};

document.getElementById("toggle-teeth").onchange = e => {
    state.fort.teeth = e.target.checked;
    apply();
};

/* BASEMAP */
document.getElementById("basemap-select").onchange = e => {
    map.removeLayer(currentBase);
    currentBase = baseLayers[e.target.value];
    currentBase.addTo(map);
};

/* NAV */
document.getElementById("prev-date").onclick = () => {
    if(currentIndex > 0) loadMap(currentIndex - 1);
};

document.getElementById("next-date").onclick = () => {
    if(currentIndex < dates.length - 1) loadMap(currentIndex + 1);
};

/* KEYBOARD */
window.addEventListener("keydown", (e) => {
    const tag = document.activeElement.tagName;
    if(["INPUT","SELECT","TEXTAREA"].includes(tag)) return;

    if(e.key === "ArrowLeft"){
        e.preventDefault();
        if(currentIndex > 0) loadMap(currentIndex - 1);
    }

    if(e.key === "ArrowRight"){
        e.preventDefault();
        if(currentIndex < dates.length - 1) loadMap(currentIndex + 1);
    }
});


    document.getElementById("timeline-notes-btn").onclick = () => {
    const popup = document.getElementById("notes-popup");

    if (popup.style.display === "block") {
        popup.style.display = "none";
        return;
    }

    const container = document.getElementById("notes-content");
    container.innerHTML = "";

    notes
    .sort((a, b) => {
        const [da, ma, ya] = a.date.split(".");
        const [db, mb, yb] = b.date.split(".");

        const dateA = new Date(`${ya}-${ma}-${da}`);
        const dateB = new Date(`${yb}-${mb}-${db}`);

        return dateB - dateA; // newest first
    })
    .forEach(n => {
        const div = document.createElement("div");
        div.className = "note-item";
        div.innerHTML = `
            <div class="note-date">${n.date}</div>
            <div class="note-text">${n.text}</div>
        `;
        container.appendChild(div);
    });

    popup.style.display = "block";
};


    /* NOTES CLICK HANDLER */
document.addEventListener("click", (e) => {
    const el = e.target;

    if (el.classList.contains("map-link")) {
        e.preventDefault();

        const lat = parseFloat(el.dataset.lat);
        const lng = parseFloat(el.dataset.lng);
        const zoom = parseInt(el.dataset.zoom) || 8;

        map.setView([lat, lng], zoom);
    }
});


/* SETTINGS */
document.getElementById("left-settings-btn").onclick = () => {
    const el = document.getElementById("topright-controls");
    el.style.display = el.style.display === "block" ? "none" : "block";
};

/* INIT */
loadMap(dates.length - 1);
</script>
